name: CI
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ runner.os }}
      - name: Install macOS WebKit deps
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Build CLI release
        run: cargo build -p aster-cli --release --locked
      - name: Build Tauri app (debug, macOS)
        if: runner.os == 'macOS'
        working-directory: crates/aster-app
        run: pnpm dlx @tauri-apps/cli@2.12.1 build --debug --ci -- --locked
      - name: Build Tauri app (debug, Windows)
        if: runner.os == 'Windows'
        working-directory: crates/aster-app
        run: pnpm dlx '@tauri-apps/cli@2.12.1' build --debug --no-bundle --ci -- --locked
      - name: Bench CLI latency (doc.read < 50ms user time)
        if: runner.os == 'macOS'
        run: |
          echo "# bench" > /tmp/bench.md
          # Measure user time only (excludes OS process-spawn overhead)
          BEFORE=$({ /usr/bin/time -p target/release/aster read /tmp/bench.md > /dev/null; } 2>&1 | grep user | awk '{print $2}')
          echo "doc.read user time: ${BEFORE}s"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Test frontend packages
        run: pnpm -r test
      - name: Build UI
        run: pnpm -F @aster/ui build
