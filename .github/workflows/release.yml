name: Release

# Releases are built locally (scripts/stage-plugins.sh, docker/build-linux.sh).
# This workflow only runs when started by hand.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: '*.dmg'
            edition: lite
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: '*.dmg'
            edition: full
          # macos-13 (x86_64) re-added once GitHub runner capacity stabilises
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   artifact: '*.dmg'
          #   edition: lite
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   artifact: '*.dmg'
          #   edition: full
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: '*.msi'
            edition: lite
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: '*.msi'
            edition: full
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: '*.deb'
            edition: lite
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: '*.deb'
            edition: full

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.edition }}

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - run: pnpm install

      - name: Install wasm32-wasip2 target (full edition only)
        if: matrix.edition == 'full'
        run: rustup target add wasm32-wasip2

      - name: Stage bundled plugins (full edition only)
        if: matrix.edition == 'full'
        shell: bash
        run: bash scripts/stage-plugins.sh

      - name: Build Tauri app (${{ matrix.edition }} edition)
        shell: bash
        run: |
          cd crates/aster-app
          if [ "${{ matrix.edition }}" = "full" ]; then
            cargo tauri build --target ${{ matrix.target }} --features bundled-plugins --config tauri.full.conf.json
          else
            cargo tauri build --target ${{ matrix.target }}
          fi

      - name: Rename artifacts with edition prefix
        shell: bash
        run: |
          set -e
          find target/${{ matrix.target }}/release/bundle -name "${{ matrix.artifact }}" | while read f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            # Insert edition prefix before the first underscore-separated version segment
            # e.g. Aster_0.1.0_aarch64.dmg -> Aster-lite_0.1.0_aarch64.dmg
            newbase=$(echo "$base" | sed 's/^Aster_/Aster-${{ matrix.edition }}_/')
            mv "$f" "$dir/$newbase"
          done

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aster-${{ matrix.edition }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/${{ matrix.artifact }}

  release:
    needs: build
    if: always() && contains(needs.build.result, 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
