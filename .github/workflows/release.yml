name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
      publish:
        description: Create a new draft release after every selected build succeeds
        type: boolean
        default: false
      tag:
        description: Existing v* tag to build when publish is enabled
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Select platforms and release source
        id: plan
        uses: actions/github-script@v7
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const platform = process.env.PLATFORMS;
            const publish = context.eventName === 'push' || process.env.PUBLISH === 'true';
            const tag = context.eventName === 'push'
              ? context.ref.replace(/^refs\/tags\//, '')
              : process.env.RELEASE_TAG.trim();
            if (!['all', 'windows', 'macos', 'linux'].includes(platform)) {
              throw new Error(`Unsupported platform: ${platform}`);
            }
            if (publish) {
              if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
                throw new Error('Publishing requires an existing version tag such as v0.1.0-alpha.8');
              }
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              try {
                await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                throw new Error(`Release ${tag} already exists; this workflow never replaces existing assets`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const platforms = [
              { platform: 'macos', os: 'macos-latest', target: 'aarch64-apple-darwin', bundles: 'dmg', extensions: ['.dmg'] },
              { platform: 'windows', os: 'windows-latest', target: 'x86_64-pc-windows-msvc', bundles: 'nsis,msi', extensions: ['.exe', '.msi'] },
              { platform: 'linux', os: 'ubuntu-22.04', target: 'x86_64-unknown-linux-gnu', bundles: 'deb', extensions: ['.deb'] },
            ];
            const include = platforms.filter(row => platform === 'all' || row.platform === platform)
              .flatMap(row => ['lite', 'full'].map(edition => ({ ...row, edition })));
            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('checkout_ref', publish ? `refs/tags/${tag}` : context.sha);
            core.setOutput('tag', publish ? tag : '');
            core.setOutput('publish', String(publish));

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Verify tag matches the application version
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('crates/aster-app/tauri.conf.json', 'utf8'));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Tag ${process.env.RELEASE_TAG} does not match application version ${version}`);
            }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.edition }}

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Install WASM target (full edition only)
        if: matrix.edition == 'full'
        run: rustup target add wasm32-wasip2

      - name: Stage bundled plugins (full edition only)
        if: matrix.edition == 'full'
        run: node scripts/stage-plugins.mjs

      - name: Build Tauri app (${{ matrix.edition }} edition, Unix)
        if: runner.os != 'Windows'
        working-directory: crates/aster-app
        shell: bash
        env:
          EDITION: ${{ matrix.edition }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(build --target "$TARGET" --bundles "$BUNDLES" --ci)
          if [ "$EDITION" = full ]; then
            args+=(--features bundled-plugins --config tauri.full.conf.json)
          fi
          pnpm dlx @tauri-apps/cli@2.12.1 "${args[@]}" -- --locked

      - name: Build Tauri app (${{ matrix.edition }} edition, Windows)
        if: runner.os == 'Windows'
        working-directory: crates/aster-app
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          $buildArguments = @('build', '--target', $env:TARGET, '--bundles', $env:BUNDLES, '--ci')
          if ($env:EDITION -eq 'full') {
            $buildArguments += @('--features', 'bundled-plugins', '--config', 'tauri.full.conf.json')
          }
          $buildArguments += @('--', '--locked')
          pnpm dlx '@tauri-apps/cli@2.12.1' @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect installers with edition names and checksums
        uses: actions/github-script@v7
        env:
          EDITION: ${{ matrix.edition }}
          TARGET: ${{ matrix.target }}
          EXTENSIONS: ${{ toJSON(matrix.extensions) }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const extensions = JSON.parse(process.env.EXTENSIONS);
            const directory = path.join('target', process.env.TARGET, 'release', 'bundle');
            async function filesIn(dir) {
              const entries = await fs.readdir(dir, { withFileTypes: true });
              return (await Promise.all(entries.map(entry => {
                const file = path.join(dir, entry.name);
                return entry.isDirectory() ? filesIn(file) : [file];
              }))).flat();
            }
            const files = (await filesIn(directory)).filter(file => extensions.includes(path.extname(file)));
            for (const extension of extensions) {
              if (files.filter(file => path.extname(file) === extension).length !== 1) {
                throw new Error(`Expected one ${extension} installer for ${process.env.EDITION}`);
              }
            }
            await fs.mkdir('release-dist', { recursive: true });
            const checksums = [];
            for (const file of files.sort()) {
              const base = path.basename(file);
              if (!base.startsWith('Aster_')) throw new Error(`Unexpected installer name: ${base}`);
              const name = base.replace(/^Aster_/, `Aster-${process.env.EDITION}_`);
              const bytes = await fs.readFile(file);
              await fs.writeFile(path.join('release-dist', name), bytes, { flag: 'wx' });
              checksums.push(`${crypto.createHash('sha256').update(bytes).digest('hex')}  ${name}`);
            }
            const checksumName = `SHA256SUMS-${process.env.EDITION}-${process.env.TARGET}.txt`;
            await fs.writeFile(path.join('release-dist', checksumName), checksums.join('\n') + '\n');

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aster-${{ matrix.edition }}-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace existing assets"
            exit 1
          fi
          options=(--verify-tag --draft --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${options[@]}" artifacts/*
