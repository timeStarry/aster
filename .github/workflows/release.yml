name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: '*.dmg'
          # macos-13 (x86_64) re-added once GitHub runner capacity stabilises
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   artifact: '*.dmg'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: '*.msi'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: '*.deb'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - run: pnpm install

      - name: Build Tauri app
        run: |
          cd crates/aster-app
          cargo tauri build --target ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aster-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/${{ matrix.artifact }}

  release:
    needs: build
    if: always() && contains(needs.build.result, 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
