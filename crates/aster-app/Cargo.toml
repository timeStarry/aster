[package]
name = "aster-app"
version = "0.1.0-alpha.8"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "aster_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aster-core = { path = "../aster-core" }
aster-rpc  = { path = "../aster-rpc" }
tauri = { version = "~2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
fontdb = "=0.23.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "=0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSColor", "NSGraphics", "NSGlassEffectView", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.1"

[features]
default = []
bundled-plugins = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
