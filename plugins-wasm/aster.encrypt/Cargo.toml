[package]
name = "aster-encrypt"
version = "0.1.0-alpha.4"
edition = "2021"

[lib]
# rlib for native tests; CI overrides to cdylib via `cargo rustc --crate-type cdylib` for wasm32
crate-type = ["rlib"]

[dependencies]
wit-bindgen = { workspace = true, features = ["macros"] }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
