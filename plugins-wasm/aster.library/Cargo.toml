[package]
name = "aster-library"
version = "0.1.0-alpha.3"
edition = "2021"

[lib]
# rlib for native tests; CI overrides to cdylib via `cargo rustc --crate-type cdylib` for wasm32
crate-type = ["rlib"]

[dependencies]
wit-bindgen = { workspace = true, features = ["macros"] }
serde_json = { workspace = true }

